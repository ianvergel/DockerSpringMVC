services:
  # 1. Oracle Database Service
  oracle_db:
    image: gvenzl/oracle-free:latest
    container_name: oracle_db
    environment:
      - ORACLE_PASSWORD=ian12345
      - APP_USER=oracle_user
      - APP_USER_PASSWORD=ian12345
    ports:
      - "1521:1521" 
    volumes:
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # 2. Spring Boot Service
  backend_app:
    build:
      context: ./spring_mvc
      dockerfile: Dockerfile
      target: backend-run
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=oracle_db
      - DB_PORT=1521
      - DB_SERVICE=FREEPDB1
      - DB_USER=oracle_user
      - DB_PASS=ian12345
    depends_on:
      oracle_db:
        condition: service_healthy

  frontend_app:
    build:
      context: ./spring_mvc
      dockerfile: Dockerfile
      target: frontend-run
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend_app
        
volumes:
  oradata:  # Ensures your data isn't deleted when the container stops
